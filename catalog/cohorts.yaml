# Question sets. ids_sha256 = sha256 of the sorted, newline-joined IDs (pilot_eval.catalog.ids_digest).
# prior_uses: every place the set has already been used, so later work knows what is not held out.
cohorts:
  gsm8k-test-cohort150:
    description: ADR 0001 frozen GSM8K test cohort ("test-150-seed-42"), 150 questions.
    split: test
    dataset: openai/gsm8k main, revision 740312add88f781978c0658806c59bc2815b9866
    size: 150
    source: {location: local, path: plans/pilot2-sft-fp32-l4-batch8-v1/evaluation.items.json, id_field: id}
