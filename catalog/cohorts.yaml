        gsm8k:test:539, gsm8k:test:541, gsm8k:test:592, gsm8k:test:601, gsm8k:test:611, gsm8k:test:663, gsm8k:test:727,
        gsm8k:test:758, gsm8k:test:788, gsm8k:test:939'
      - 'C-attribution rehearsal-pod-1 (rehearsal): attribution over sampled rows and selection, freeze (sha256 offline-grpo
        b24377e0c19c6138, online-grpo 56fe5e8ba284ac4a); questions gsm8k:test:186, gsm8k:test:285, gsm8k:test:611, gsm8k:test:817'
      - 'C-attribution rehearsal-pod-1 (rehearsal): greedy ablation of the frozen selection; questions gsm8k:test:1116,
        gsm8k:test:13, gsm8k:test:1300, gsm8k:test:186, gsm8k:test:285, gsm8k:test:538, gsm8k:test:611, gsm8k:test:817'
