    prior_uses:
      - Pilot 2/4 greedy evaluation of gold-sft and online-grpo
      - Pilot 4 behaviour (greedy + 8 sampled draws) for online-grpo; offline GRPO behaviour likewise
      - Stage 0 sampling-behaviour (greedy) for sampling-sft k0/k2/k5
      - attribution production-1 Stage D greedy generation (gold-sft, online-grpo, untuned)
      - 'C-attribution rehearsal-pod-1 (rehearsal): qualification numerics (log-probabilities, finite differences with
        leave-one-out reward weights) on sampled rows; questions gsm8k:test:1000, gsm8k:test:1034, gsm8k:test:1093, gsm8k:test:1099,
        gsm8k:test:1104, gsm8k:test:114, gsm8k:test:1220, gsm8k:test:130, gsm8k:test:1301, gsm8k:test:163, gsm8k:test:191,
