# Sparse Sampling-SFT (k = 2) rewiring — Run A (matched lambda) launch-record DRAFT.
#
# Schema and rules: pilot_eval/sparse_rewiring_k2_plan.py.
# Run B (conditional headroom-scaled lambda) uses the exact same template with
# objective.lambda_regime: scaled and objective.l0_lambda set from Stage 1 val128-k2 headroom.
#
# YAML numbers: write a dot and signed exponent (6.0e-4, not 6e-4) so PyYAML parses as float.
schema: sparse-rewiring-k2/launch-record-v1
mode: production
label: production-k2-matched
code_commit: null                        # filled by `seal`
executable_sha256: null                  # filled by `seal` from verified executable sources

pod_id: null                             # filled by `seal`
pod_stop_commands: ['runpodctl stop pod {id}', 'runpodctl pod stop {id}']
volume_identity: sl-0
export_repo: Prasadmahadik/spar-sampling-sft-artifacts
hourly_cost_usd: not-tracked
timeouts_seconds: {copy: 2700, export_attempt: 3600, stop_attempt: 120, writer_join: 300}
marker_stale_seconds: 900
disk: {min_free_gb: 20, container_total_gb: 80}   # Rank 1 x 2 seeds checkpoints are ~72 MB total

hardware: {gpu: A100-80GB, count: 1}

arms:
  sparse-k2-sft-r1-matched-s42: {run_id: sparse-k2-sft-r1-matched-s42, rank: 1, read_lr: 3.0e-3, seed: 42}
  sparse-k2-sft-r1-matched-s43: {run_id: sparse-k2-sft-r1-matched-s43, rank: 1, read_lr: 3.0e-3, seed: 43}

model: {layers: 28, hidden: 1536, intermediate: 8960, parts: [gate, up], positions: all-unpadded}

data:
  recipe: sampling-sft-k2
  k: 2
  total_slots: 512
  training_examples: 477                 # automatic-verdicts-accepted-v1 (k2=35 uncovered)
  uncovered_slots: 35
  steps_per_epoch: 64                    # K2-D3: 64 steps/epoch (epoch 1 Gold batches 3..8; epochs 2..16 29x8 + 35x7)
  examples_per_step_nominal: 8
  microbatch: 1
  examples_per_mask: 4
  gold_order_steps: 64
  later_epochs: reshuffle-64-batches-per-epoch
  loss: gold-completion-loss-step-token-denominator
  targets: sampling-sft-k2-stored-ids

training:
  steps: 1024                            # 16 exact epochs
  warmup_steps: 20
  schedule: linear-warmup-cosine-to-zero
  freeze_after_step: 960
  freeze_rule: z_det>0

objective:
  lambda_regime: matched
  l0_lambda: 6.0e-4                      # Run A exact Gold penalty; Run B scales to Stage 1 headroom if < 4 survivors
  l0_term: once-per-step-expected-active
  run_b_trigger_below: 4                 # K2-D1

optimizer:
  name: adamw
  implementation: foreach-off
  reads: {betas: [0.9, 0.99], eps: 1.0e-8, weight_decay: 0.0, clip_norm: 1.0}
  masks: {lr: 0.1, betas: [0.9, 0.99], eps: 1.0e-8, weight_decay: 0.0, clip: none}

hard_concrete: {beta: 0.6666666666666666, gamma: -0.1, zeta: 1.1, log_alpha_init: 1.0,
                read_init: 'a~N(0,1)/sqrt(d);b=0'}

seeds: {data_order_base: 42, mask_noise_offset: 1000}   # seed 42 -> mask_noise 1042; seed 43 -> mask_noise 1043

runtime:
  dtype: float32
  precision: ieee
  attention: eager
  kv_cache: off-in-training
  gradient_checkpointing: non-reentrant
  determinism: full
  cublas_workspace: ':4096:8'

checkpoints: [0, 8, 16, 32, 64, 128, 256, 512, 768, 960, 1024]

cadences:
  step_metrics_every: 1
  validation_ce_every: 16
  gate_snapshot_every: 16
  settle: {first: 256, every: 64, jaccard_min: 0.99, expected_change_max: 0.02}

storage:
  checkpoint_contents: [read_factors, log_alpha, seal]
  optimizer_state: none
  interruption: restart-from-step-0
  gate_snapshot_dtype: float16

evaluation:
  validation: {questions: 128, targets: val128-k2-targets, generator_engine: hf-fp32-ieee, ce_masks: deterministic, greedy_at: checkpoints}
  cohort150: {steps: [64, 1024], role: evaluation-only}
  cap: 1024
  eos_token_id: 151645
  repetition_penalty: 1.0
  scorer: flexible-v3
  batch_size: 16

qualification:                           # Ticket 15 (pilot_eval.rewire_qualification) automatic sign-off
  memory_fraction: 0.80
  disposable_steps: 4
  greedy_questions: 16
  cached_vs_forced_rows: 8
  cached_vs_forced_abs_max: 1.0e-3
  recompute_rel_max: 1.0e-5

routing:
  gate_receipt: none                     # Run A seed 42 runs first; seed 43 requires verified seed 42 >= 4 survivors
  headroom_summary: none

decisions:
  K2-D1: '[user 2026-11-26] Run A matched lambda 6.0e-4; trigger conditional Run B (headroom-scaled lambda) if < 4 survivors'
  K2-D2: '[user 2026-11-26] Rank 1 (read_lr 3.0e-3) across 2 seeds (42, 43); seed 43 runs on surviving lambda'
  K2-D3: '[user 2026-11-26] 64 steps/epoch: epoch 1 Gold batches (3..8); epochs 2..16 reshuffled 29x8 + 35x7 = 477'
  K2-D4: '[user 2026-11-27] val128 k=2 targets generated with hf-fp32-ieee using exact k=2 sampling recipe (J=64, cap=1024, T=0.6, rep_pen=1.1, top_p=1.0, top_k=0, 4 attempts)'
  K2-D5: '[user 2026-11-27] 1x A100-80GB + sl-0 export to Prasadmahadik/spar-sampling-sft-artifacts (compact survivor/metrics/delta-act JSONs + R1 checkpoints)'

inputs:
  artifact_root: null                    # filled by `seal`
  bundle: null                           # filled by `seal`
  model_dir: null                        # filled by `seal`
  work_dir: null                         # filled by `seal`
  k2_training_data: runs/sampling-sft/sampling-sft-v1/training-data/l4-training-data-v1
  k2_lora_adapter: runs/sampling-sft/sampling-sft-v1/training/l4-night-v1-train-k2/checkpoints/checkpoint-64
  gold_order: runs/pilot-2/Qwen--Qwen2.5-1.5B-Instruct/gsm8k/train-512-seed-42/rank1-float32/pilot2-sft-fp32-l4-batch8-v1/inputs/order.json
  val128_k2_targets: null                # filled by `seal` after Stage 1 generates val128 k=2 targets
