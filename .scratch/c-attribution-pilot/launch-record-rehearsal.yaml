                  'gsm8k:test:13', 'gsm8k:test:1116', 'gsm8k:test:538', 'gsm8k:test:1300']
    offline-grpo: ['gsm8k:test:817', 'gsm8k:test:611', 'gsm8k:test:285', 'gsm8k:test:186',
                   'gsm8k:test:13', 'gsm8k:test:1116', 'gsm8k:test:538', 'gsm8k:test:1300']
  generation_conditions: [intact, top10-adapters, global64-reads]   # ticket 11: 3 conditions; one per removal kind

attribution: {token_budget: 8192, questions_per_unit: 2}   # budget [production-1]; 2 units per arm to test resume
generation: {batch_size: 16, cap: 1024, eos_token_id: 151645}   # batch [production-1 qualified]; cap, EOS [spec]
selection:
  k_adapters: 10                         # [spec]
  k_reads: 64                            # [spec]
  k_harmful: 10                          # [spec] reported only
  tolerance: 0.20                        # [spec] matched-control write tolerance
  seeds: {top10-adapters: 20261121, global64-reads: 20261122, hot64-reads: 20261123, layer64-reads: 20261124}
                                         # [user 2026-11-19] one matching seed per group; values [for approval]
statistics: {split_seed: 20261118, bootstrap_seed: 1234, resamples: 10000}   # [user 2026-11-19]

hot_layers:                              # [user 2026-11-19] computed by code with the union rule; re-derived at
