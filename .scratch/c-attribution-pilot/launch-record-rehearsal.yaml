  bundle: null                           # filled by `seal`: the sealed bundle manifest (ticket 08)
  model_dir: null                        # filled by `seal`: pinned base model snapshot (HF_HOME off the volume)
  work_dir: null                         # filled by `seal`: container-disk work directory
  sources:
