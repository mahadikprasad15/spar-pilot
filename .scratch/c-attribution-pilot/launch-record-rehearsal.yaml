# C-attribution — attended Pod REHEARSAL launch record (ticket 11). Needs the user's approval before `seal`.
#
# A machinery and measurement run, not production: 2 arms x 4 whole questions x 8 draws, checks (a)-(f),
# aggregation on the subset, a split, a freeze, then greedy on 8 questions x 3 conditions. It measures the floors
# and throughput that the production record's tolerances are set from (by the user). It ends with a real Pod stop.
#
# Sealed on the Pod with:
#   $PY -m pilot_eval.c_attribution_chain seal --draft <this file> --out $WORK/launch_record.json \
#       --artifact-root $WORK/inputs --bundle <bundle manifest> --model-dir $HF_HOME/... --work-dir $WORK
# `seal` fills only empty fields (the code commit, pod_id from RUNPOD_POD_ID, the four input paths) and refuses
# anything else that is empty, any '[proposed]' value, unknown keys and wrong types (every leaf is typed).
#
# Legend: [production-1] carried over unchanged / [user <date>] / [spec] / [for approval] value chosen here for
# the user to approve with this record.
schema: c-attribution/launch-record-v1
run_id: c-rehearsal-pod-1                # ticket 11
mode: rehearsal
label: rehearsal-pod-1
code_commit: null                        # filled by `seal` from the checkout
arms: [online-grpo, offline-grpo]

pod_id: null                             # filled from RUNPOD_POD_ID by `seal`
pod_stop_commands: ['runpodctl stop pod {id}', 'runpodctl pod stop {id}']   # lesson pod-v1: both syntaxes
volume_identity: sl-0                    # ticket 11: sl-0 attached
export_repo: Prasadmahadik/spar-sampling-sft-artifacts   # [production-1] private export repo
hourly_cost_usd: null                    # [user] Pod price per hour (summary cost line only)
timeouts_seconds: {copy: 2700, export_attempt: 3600, stop_attempt: 120, writer_join: 300}   # [production-1]
marker_stale_seconds: 900                # [production-1]
disk: {min_free_gb: 60, container_total_gb: 120}   # ticket 09 preflight

tolerances:
  finite_difference: {epsilon: 1.0e-2, median_rel_err_max: 0.05, max_rel_err_max: 0.20, precision: fp64}   # [production-1]
  neuron_sum_identity: 1.0e-4            # [production-1], gross denominator
  batch_invariance: 1.0e-4               # [production-1], fraction of max |attr|
  memory_fraction: 0.80                  # [production-1] peak <= 80% of device memory
  cached_vs_forced: {per_token_abs_max: measure-only, per_row_abs_M_max: measure-only}
                                         # [user 2026-11-18] set from this rehearsal's measurements
