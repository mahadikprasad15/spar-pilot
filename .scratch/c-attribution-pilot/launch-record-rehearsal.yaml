  k: 10
  module: down
  arms: [online, offline]
  combine: union

decisions:                               # the resolved decisions this run follows (spec, 2026-11-18/19)
  time_caps: none; elapsed time is logged only and the watchdog deadline is disabled
  tolerances: production-1 unchanged; cached-against-forced set from the rehearsal
  infeasible_layer64_control: run the target; report the control unavailable
  positive_shortfall: freeze the smaller group; match its control to the actual size; never pad or drop
  draw_split: kept beside the question split
  intact_repeat: one second intact greedy pass per arm (production)
  hot_layers: union of each arm's top-10 effective-write modules that are down_proj
  stability: descriptive only; never stops the chain
  handover: none; production is a separate launch with its own record

inputs:
