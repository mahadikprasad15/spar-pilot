  rows_per_arm: 16                       # [spec] check (a)
  fd_rows: 4                             # [production-1]
  fd_adapters: 5                         # [spec]
  fd_neurons: 3                          # [spec]
  head_chunk: 1024                       # [production-1]
  noop_greedy_tokens: 16                 # [for approval] check (f) greedy-token comparison length
  batch_invariance_budgets: [8192]       # [production-1] qualified token budget

scope:                                   # [for approval] cohort150 IDs; recorded as prior uses (ticket 11)
  # 817 short, all-correct in both arms; 611 longest (offline: the capped and invalid row; online: all-wrong);
  # 285 invalid rows, mixed in both; 186 long, online mixed with an invalid row, offline all-wrong.
  attribution_questions:
    online-grpo: ['gsm8k:test:817', 'gsm8k:test:611', 'gsm8k:test:285', 'gsm8k:test:186']
    offline-grpo: ['gsm8k:test:817', 'gsm8k:test:611', 'gsm8k:test:285', 'gsm8k:test:186']
  generation_questions:
